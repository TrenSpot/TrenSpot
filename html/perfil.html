<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="description" content="TrenSpot: plataforma desenvolvida na FIAP que facilita a navegação no metrô com foco em inclusão social e conteúdos baseados na localização.">
    <meta name="keywords" content="Metro, Transporte, Localização">
    <title>TrenSpot</title>
    <link rel="stylesheet" href="../assets/css/style.css">

    <!-- Estilo exclusivo da perfil page (para não carregar em todas as páginas) -->
    <style>
        /* Corpo */ 
        .wrapper_perfil {
            background-color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 200px;
        }
        .info_side {
            width: 100%;
            margin-bottom: 70px;
        }
        .banner {
            background-color: var(--verde3);
            width: 100%;
            height: 200px;
        }
        .banner img {
            position: absolute;
            width: 40px;
            right: 10px;
            display: none;
        }
        .info_side > img {
            width: 250px;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            top: 130px;
        }
        .info_side h2 {
            text-align: center;
            margin-top: 130px;
            font-family: 'Roboto';
            color: var(--verde3);
        }
        .options_side {
            display: flex;
            flex-direction: column;
        }
        .btns {
            display: flex;
            margin-bottom: 200px;
        }
        .btn {
            display: flex;
            align-items: center;
            width: 200px;
            border: 4px solid var(--azul2);
            border-radius: 10px;
            background-color: var(--azul2);
            text-align: center;
            font-size: 16px;
            font-weight: 600;
            padding: 10px;
            color: var(--verde3);
            margin: 10px;
        }
        .wrapper_perfil .options_side > button {
            font-size: 18px;
        }
        #localizacao:checked + label {
            background-color: var(--azul1);
            color: var(--verde1);
            z-index: 1;
        }
        .btn img {
            width: 25px;
        }
        input[type="checkbox"] {
            display: none;
        }
        .options_side > button {
            border: none;
            background: none;
            font-size: 16px;
            font-weight: 600;
            text-decoration: underline;
            color: var(--verde3);
        }
        .editarPerfil {
            display: none;
            position: fixed;
            left: 50%;
            transform: translateX(-50%);
            background-color: var(--verde1);
            color: white;
            padding: 50px 20px;
            font-size: 20px;
            border-radius: 10px;
        }
        .editarPerfil span {
            position: absolute;
            top: 20px; 
            right: 10px;
            width: 30px;
            height: 6px; 
            background-color: var(--verde3);
            transform: rotate(45deg);
        }
        .editarPerfil span:last-child { 
            transform: rotate(-45deg);
        }
        .editarPerfil label:last-child {
            text-decoration: underline;
            color: var(--amarelo1);
            margin-top: 20px
        }
        .editarPerfil input[type="text"] {
            width: 250px;
            background-color: var(--azul1);
            border: none;
            border-radius: 10px;
            padding: 7px;
            margin: 20px;
        }
        .editarPerfil input[type="text"]::placeholder{
            font-size: 16px;
            color: var(--verde3);
            opacity: .5;
        }
        .editarPerfil button {
            border: none;
            border-radius: 10px;
            padding: 10px 30px;
            background-color: var(--amarelo1);
            color: var(--verde3);
            font-size: 18px;
            margin: 50px 0 20px 0;
        }
        #editar:checked ~ .editarPerfil {
            display: block;
        }
        @media (max-width: 500px) {
            .btns {
                display: flex;
                flex-direction: column;
            }
        }
    </style>

    <!-- Passando o tamanho das telas diretamente no link do CSS -->
    <link rel="stylesheet" href="../assets/css/styleSM.css" media="(max-width: 600px)">
    <link rel="stylesheet" href="../assets/css/styleMD.css" media="(min-width: 601px) and (max-width: 1024px)">
    <link rel="stylesheet" href="../assets/css/styleLG.css" media="(min-width: 1025px)">    
    <link rel="shortcut icon" href="../assets/img/logo.png" type="image/x-icon">
</head>

<!-- Corpo do Site -->
<body>
     <!-- Script de validação de usuário (antes de carregar a página) -->
    <script>
        if (localStorage.getItem('logado') != 'true' && sessionStorage.getItem('logado') != 'true') {
            window.location.href = 'login.html';
            sessionStorage.setItem('msgErro', '1');
        }
        else {
            sessionStorage.setItem('msgErro', '0');
            
        }
    </script>

    <!-- Cabeçalho -->
    <header role="banner">  
        <a href="index.html" class="logo"><img src="../assets/img/logo_header.png" alt="logo" title="logo"></a>
        <span></span>
        <input type="checkbox" id="menu_toggle">
        <nav role="navigation">
            <ul>
                <label for="menu_toggle"><span></span><span></span></label>
                <li><a href="index.html"><div><img src="../assets/img/home_icon.png" alt="Home">Home</div></a></li>
                <li><a href="trajeto.html"><div><img src="../assets/img/loc_icon.png" alt="localizar">Trajeto</div></a></li>
                <li class="small"><a href="#perfil"><div><img src="../assets/img/perfil_icon.png" alt="perfil">Perfil</div></a></li>
                <li><a href="quem_somos.html"><div><img src="../assets/img/quemSomos_icon.png" alt="quem somos">Quem Somos</div></a></li>
            </ul>
        </nav>
        <button onclick="validarUsuário()"><img src="../assets/img/usuario.png" alt="perfil" title="perfil"></button>
        <label for="menu_toggle" class="menu_btn"><span></span></label>
    </header>
    
    <!-- Conteúdo da página -->
    <main class="main_perfil">
        <a name="perfil" style="display: none;"></a>
        <!-- direcionar até o conteúdo -->
        <section class="wrapper_perfil">
            <div class="info_side">
                <div class="banner"><img src="../assets/img/lapisAzul1_icon.png" alt="editar banner"></div>
                <img src="../assets/img/bigUsuario.png" alt="foto do usuário">
                <h2 id="nomeUsuario"></h2>
            </div>
            <div class="options_side">
                <div class="btns">
                    <input type="checkbox" id="localizacao" name="localizacao">
                    <label for="localizacao" class="btn">
                        <h3>Habilitar Localização</h3>
                    </label>
                    <label for="editar" class="btn">
                        <h3>Editar perfil</h3>
                        <img src="../assets/img/lapisVerde3_icon.png" alt="editar perfil">
                        <input type="checkbox" id="editar" name="editar">
                        <div class="editarPerfil">
                            <label for="editar"><span></span><span></span></label>
                            <label for="alterarNome">
                                <p>Alterar nome:</p>
                                <input type="text" id="alterarNome" name="alterarNome" placeholder="Altere seu nome...">
                            </label>
                            <button onclick="alterarNome()"><h3>Confirmar</h3></button><br>
                            <label for="editar">Cancelar</label>
                        </div>
                    </label>
                </div>
                <button onclick="sairConta()">Sair da conta</button>
            </div>
        </section>
    </main>

    <!-- Rodapé -->
    <footer role="contentinfo">
            <div class="cols">
            <!-- primeira coluna -->
            <div class="footer_col1">
                <a href="#home"><img src="../assets/img/logo_rodape.png" alt="logo" title="logo"></a>
                <div class="social_medias">
                    <a href="https://www.instagram.com/invites/contact/?igsh=i3925y7rnona&utm_content=w0soki" target="_blank" aria-label="Instagram TrenSpot">
                        <img src="../assets/img/instagram_logo.png" alt="instagram" title="instagram">
                    </a>
                    <a href="mailto:trenspot3@gmail.com" target="_blank" aria-label="Email TrenSpot">
                        <img src="../assets/img/email_logo.png" alt="email" title="email">
                    </a>
                    <a href="https://github.com/TrenSpot" target="_blank" aria-label="GitHub TrenSpot">
                        <img src="../assets/img/github_logo.png" alt="GitHub" title="GitHub">
                    </a>
                </div>
            </div>
            <!-- segunda coluna -->
            <div class="footer_col2">
                <h6>Sobre</h6>
                <p>TrenSpot é o site que visa contribuir com o conforto e segurança da sua viagem. Desenvolvido no projeto challenge da FIAP em 2024.</p>
            </div>
        </div>
        <!-- copyright -->
        <div class="copy">
            <p>© copyright 2024 TrenSpot - Todos os direitos reservados.</p>
        </div>
    </footer>

    <!-- Script -->
    <script src="../assets/js/script.js"></script>

    <!-- Script exclusivo da perfil page -->
     <script>
        var nomeUsuario = document.getElementById('nomeUsuario');
        nomeUsuario.innerText = localStorage.getItem('nome') || 'Nome do Usuário';

        function alterarNome() {
            var alterarNome = document.getElementById('alterarNome');
            var fechar = document.getElementById('editar');

            editar.checked = false;
            localStorage.setItem('nome', alterarNome.value);
            nomeUsuario.innerText = localStorage.getItem('nome');
        }

        function sairConta() {
            localStorage.removeItem('nome');
            localStorage.removeItem('email');
            localStorage.removeItem('senha');
            localStorage.removeItem('logado');
            sessionStorage.removeItem('logado');
            window.location.href = 'login.html';
        }
     </script>
</body>
</html>
